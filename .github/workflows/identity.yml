name: Identity CI

on:
  push:
    branches: [main, feature/central-identity]
    paths:
      - 'src/TriSend.Auth.**/**'
      - 'docs/identity/**'
      - '.github/workflows/identity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/TriSend.Auth.**/**'
      - 'docs/identity/**'
      - '.github/workflows/identity.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/TriSend.Auth.Api/TriSend.Auth.Api.csproj
      - run: dotnet build src/TriSend.Auth.Api/TriSend.Auth.Api.csproj --configuration Release --no-restore
