name: Weekly TriSend Build

on:
  schedule:
    # Every Monday at 08:00 India Standard Time (02:30 UTC)
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-trisend-build
  cancel-in-progress: false

jobs:
  build:
    name: Restore and build TriSend API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API project
        run: dotnet restore backend/TriSend.Api/TriSend.Api.csproj

      - name: Build API project
        run: dotnet build backend/TriSend.Api/TriSend.Api.csproj --no-restore --configuration Release
